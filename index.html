<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Configuración de codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Permite la correcta visualización en dispositivos móviles -->
    <title>Cotizador Profesional de Impresión 3D</title>
    <!-- Título de la página -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Enlace al archivo CSS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Fuente externa -->
  </head>
  <body>
    <div class="container">
      <!-- Contenedor principal -->
      <h1>💰 Cotizador de Impresión 3D</h1>
      <!-- Título principal -->

      <div class="input-section">
        <!-- Sección de entradas de datos -->

        <!-- Primera fila de entradas -->
        <div class="input-row">
          <div class="input-group">
            <label for="precioPlastico">
              Precio por kilo de plástico
              <span class="tooltip"
                >(Costo actual del material por kilogramo)</span
              >
            </label>
            <input
              type="number"
              id="precioPlastico"
              placeholder="Ej: 7000"
              min="0"
            />
          </div>

          <div class="input-group">
            <label for="cantidadPlastico">
              Plástico utilizado (gramos)
              <span class="tooltip">(Peso real utilizado en la impresión)</span>
            </label>
            <input
              type="number"
              id="cantidadPlastico"
              placeholder="Ej: 150"
              min="0"
            />
          </div>
        </div>

        <!-- Segunda fila de entradas -->
        <div class="input-row">
          <div class="input-group">
            <label for="tiempoImpresion">
              Tiempo de impresión (horas)
              <span class="tooltip"
                >(Duración total del proceso de impresión)</span
              >
            </label>
            <input
              type="number"
              id="tiempoImpresion"
              placeholder="Ej: 4"
              min="0"
              step="0.1"
            />
          </div>

          <div class="input-group">
            <label for="mantenimiento">
              Mantenimiento
              <span class="tooltip"
                >(Costo promedio por mantenimiento preventivo)</span
              >
            </label>
            <input
              type="number"
              id="mantenimiento"
              placeholder="Ej: 500"
              min="0"
            />
          </div>
        </div>

        <!-- Tercera fila de entradas -->
        <div class="input-row">
          <div class="input-group">
            <label for="depreciacion">
              Depreciación por hora
              <span class="tooltip"
                >(Costo de desgaste de equipo por hora de uso)</span
              >
            </label>
            <input
              type="number"
              id="depreciacion"
              placeholder="Ej: 50"
              min="0"
            />
          </div>

          <div class="input-group">
            <label for="margenError">
              Margen de seguridad (%)
              <span class="tooltip"
                >(Porcentaje adicional para imprevistos)</span
              >
            </label>
            <input
              type="number"
              id="margenError"
              placeholder="Ej: 10"
              min="0"
              max="100"
            />
          </div>
        </div>

        <!-- Cuarta fila de entradas -->
        <div class="input-row">
          <div class="input-group">
            <label for="consumoImpresora">
              Consumo eléctrico de la impresora (kW)
              <span class="tooltip"
                >(Potencia en kilovatios de la impresora)</span
              >
            </label>
            <input
              type="number"
              id="consumoImpresora"
              placeholder="Ej: 0.35"
              min="0"
              step="0.01"
            />
          </div>

          <div class="input-group">
            <label for="costoKwh">
              Costo de la energía (kWh)
              <span class="tooltip"
                >(Costo por kilovatio-hora en tu moneda local)</span
              >
            </label>
            <input
              type="number"
              id="costoKwh"
              placeholder="Ej: 0.15"
              min="0"
              step="0.01"
            />
          </div>
        </div>

        <!-- Quinta fila de entradas -->
        <div class="input-row">
          <div class="input-group">
            <label for="ganancia">
              Ganancia deseada (%)
              <span class="tooltip"
                >(Porcentaje de ganancia sobre el costo total)</span
              >
            </label>
            <input
              type="number"
              id="ganancia"
              placeholder="Ej: 20"
              min="0"
              max="100"
            />
          </div>
        </div>
      </div>

      <!-- Botón para calcular el costo total -->
      <button id="btnCalcular">Calcular Costo Total</button>

      <!-- Sección donde se mostrará el resultado -->
      <div class="resultado" id="resultado">
        <div class="card">
          <h2>📊 Detalle del Cálculo</h2>
          <div id="detalleCosto" class="resultado-content"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <!-- Inclusión del archivo JavaScript -->
  </body>
</html>
