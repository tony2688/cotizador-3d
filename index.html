<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" /> <!-- Configuración de codificación para caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Ajuste para dispositivos móviles -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" /> <!-- Política de seguridad del contenido -->
    <title>Cotizador Profesional Bambu Lab A1 Mini</title> <!-- Título de la página -->
    <link rel="stylesheet" href="styles.css" /> <!-- Enlace al archivo de estilos -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    /> <!-- Fuente de Google Fonts -->
  </head>
  <body>
    <div class="container"> <!-- Contenedor principal -->
      <h1>💰 Cotizador de Impresión 3D</h1> <!-- Título principal -->

      <div class="input-section"> <!-- Sección de entrada de datos -->
        <div class="input-row"> <!-- Fila de inputs -->
          <div class="input-group">
            <label for="precioPlastico">
              Precio por kilo de plástico (ARS)
              <span class="tooltip">(Costo actual del material por kilogramo)</span>
            </label>
            <input
              type="number"
              id="precioPlastico"
              placeholder="Ej: 7000 ARS/kg"
              min="0"
            />
          </div>

          <div class="input-group">
            <label for="cantidadPlastico">
              Plástico utilizado (gramos)
              <span class="tooltip">(Peso real utilizado en la impresión)</span>
            </label>
            <input
              type="number"
              id="cantidadPlastico"
              placeholder="Ej: 150 g"
              min="0"
            />
          </div>
        </div>

        <div class="input-row"> <!-- Segunda fila de inputs -->
          <div class="input-group">
            <label for="tiempoImpresion">
              Tiempo de impresión (horas)
              <span class="tooltip">(Duración total del proceso de impresión)</span>
            </label>
            <input
              type="number"
              id="tiempoImpresion"
              placeholder="Ej: 4 h"
              min="0"
              step="0.1"
            />
          </div>

          <div class="input-group">
            <label for="mantenimiento">
              Mantenimiento (ARS)
              <span class="tooltip">(Costo promedio por mantenimiento preventivo)</span>
            </label>
            <input
              type="number"
              id="mantenimiento"
              placeholder="Ej: 500 ARS"
              min="0"
            />
          </div>
        </div>

        <div class="input-row"> <!-- Tercera fila de inputs -->
          <div class="input-group">
            <label for="depreciacion">
              Depreciación por hora (ARS/h)
              <span class="tooltip">(Costo de desgaste de equipo por hora de uso)</span>
            </label>
            <input
              type="number"
              id="depreciacion"
              placeholder="Ej: 50 ARS/h"
              min="0"
            />
          </div>

          <div class="input-group">
            <label for="margenError">
              Margen de seguridad (%)
              <span class="tooltip">(Porcentaje adicional para imprevistos)</span>
            </label>
            <input
              type="number"
              id="margenError"
              placeholder="Ej: 10%"
              min="0"
              max="100"
            />
          </div>
        </div>
      </div>

      <button id="btnCalcular">Calcular Costo Total</button> <!-- Botón para calcular el costo total -->

      <div class="resultado" id="resultado"> <!-- Sección para mostrar el resultado -->
        <div class="card">
          <h2>📊 Detalle del Cálculo</h2> <!-- Título del resultado -->
          <div id="detalleCosto" class="resultado-content"></div> <!-- Contenedor donde se mostrarán los cálculos -->
        </div>
      </div>
    </div>

    <script src="script.js"></script> <!-- Enlace al script de JavaScript -->
  </body>
</html>
